<script>window.LEKCE={"key":"anat_axial_lekce02_proto_v1","deck":"Anatomie::Axiální systém::02 Atlas a axis","stages":[{"id":"pre","title":"🤔 Co už víš?","intro":"Než začneš číst, zkus tři rychlé otázky. Chyby nevadí – po každé odpovědi uvidíš vysvětlení.","ex":[{"id":"pre","title":"🤔 Co už víš?","help":"Nanečisto – nic se nehodnotí. Jen zjistíš, co už v hlavě máš.","kind":"mcq","items":[["Který krční obratel nemá tělo ani trnový výběžek?",["atlas (C1)","axis (C2)","C7 (vertebra prominens)","C3"],0,"Atlas je jen prstenec – jeho „tělo“ se ve vývoji stalo dentem axis."],["Kde probíhá zhruba polovina rotace hlavy a krku?",["mezi C1 a C2","mezi lebkou a C1","mezi C6 a C7","rovnoměrně ve všech segmentech"],0,"Articulationes atlantoaxiales: asi 35–40° na každou stranu."],["Je mezi atlasem a axisem meziobratlová ploténka?",["ne, první disk je C2/C3","ano, nejtlustší v krku","ano, ale srůstá v dětství","jen u žen"],0,"C1 a C2 jsou spojeny jen klouby a vazy."]]}]},{"id":"t1","title":"📖 Stavba atlasu","b":{"id":"t1","title":"Stavba atlasu","img":"s15-000_lat.jpg","cap":"Atlas (C1) shora a zepředu – Neumann 9.19, popisky v latině","html":"<p><b>Atlas</b> (C1, česky <i>nosič</i>) je první krční obratel a od ostatních obratlů se zásadně liší: <b>nemá tělo (corpus) ani trnový výběžek</b>. Je to kostěný prstenec, který nese hlavu. Jeho původní tělo se během vývoje oddělilo a přirostlo k druhému obratli jako <b>dens axis</b>.</p>\n<p>Prstenec tvoří krátký <b>arcus anterior atlantis</b> (asi 1/5 obvodu), delší <b>arcus posterior atlantis</b> (asi 2/5 obvodu) a po stranách <b>massae laterales</b> (každá asi 1/5). Vpředu na předním oblouku je <b>tuberculum anterius</b> (zvenku přes kůži nehmatné, leží za stěnou hltanu; je to orientační bod na bočném RTG), na jeho zadní ploše leží <b>fovea dentis</b> – kloubní ploška pro zub axisu. Na zadním oblouku najdeme <b>tuberculum posterius</b>, což je jen zakrnělý trn, a na jeho horní ploše <b>sulcus arteriae vertebralis</b>, rýhu, ve které běží <b>a. vertebralis</b> a <b>n. suboccipitalis</b>.</p>\n<p>Oba oblouky spojují mohutné <b>massae laterales</b> – nosné sloupy, které přenášejí váhu hlavy na axis. Nahoře nesou konkávní, ledvinovité <b>foveae articulares superiores</b> pro condyli occipitales, dole téměř ploché <b>facies articulares inferiores</b> pro axis. Do stran vybíhají dlouhé <b>processus transversi</b> s <b>foramen transversarium</b>.</p>","fyzio":"<b>Palpace a Jeffersonova zlomenina.</b> Pod týlem nahmatáš měkkou jamku – atlas nemá trn; první tvrdý trn je až C2. Processus transversus atlasu je hmatný mezi hrotem processus mastoideus a úhlem mandibuly. Při axiálním nárazu na temeno (skok do mělké vody) může prasknout přední i zadní oblouk atlasu – <b>Jeffersonova zlomenina</b>.","ex":[{"kind":"hot","title":"🖼️ Popiš obrázek: atlas (Neumann 9.19)","img":"s15-000_lat.jpg","help":"Ťukni na oranžový box a napiš latinský název.","from":["b02",4],"items":[{"lat":"tuberculum posterius atlantis","cz":"zadní hrbolek atlasu","rects":[[0.4384,0.0693,0.1619,0.0409]]},{"lat":"arcus posterior atlantis","cz":"zadní oblouk atlasu","rects":[[0.1827,0.1594,0.1645,0.0492]]},{"lat":"processus transversus atlantis","cz":"příčný výběžek atlasu","rects":[[0.6966,0.2262,0.1594,0.0551],[0.8414,0.7195,0.1594,0.0551]]},{"lat":"foramen transversarium","cz":"otvor v příčném výběžku","rects":[[0.1482,0.4533,0.1728,0.0492]]},{"lat":"fovea articularis superior","cz":"horní kloubní jamka (pro condylus occipitalis)","rects":[[0.6652,0.4541,0.1778,0.0501],[0.0759,0.6811,0.2101,0.0284]]},{"lat":"arcus anterior atlantis","cz":"přední oblouk atlasu","rects":[[0.5689,0.5167,0.1573,0.0234]]},{"lat":"tuberculum anterius atlantis","cz":"přední hrbolek atlasu","rects":[[0.3333,0.5159,0.1532,0.0409],[0.4697,0.9048,0.1524,0.0409]]},{"lat":"facies articularis inferior","cz":"dolní kloubní ploška (k axis)","rects":[[0.3552,0.9541,0.194,0.0234]]},{"lat":"massa lateralis atlantis","cz":"boční hmota atlasu","rects":[[0.8001,0.9182,0.1651,0.0543]]}]},{"kind":"cloze","title":"🧩 Doplňovačka","help":"Doplň chybějící slovo a dej Zkontrolovat.","items":["Atlas nemá {{tělo}} ani {{trn}}; jeho tělo se stalo {{dentem axis}}.","Fovea dentis leží na zadní ploše {{arcus anterior}} atlasu.","V sulcus arteriae vertebralis běží {{a. vertebralis}} a n. suboccipitalis.","Fovea articularis superior je lůžko pro {{condylus occipitalis}}."]},{"kind":"match","title":"🔗 Přiřazovačka latina ↔ čeština","help":"Ťukni na latinský termín a pak na český.","items":[["atlas","nosič (C1)"],["arcus anterior atlantis","přední oblouk atlasu"],["arcus posterior atlantis","zadní oblouk atlasu"],["massa lateralis atlantis","boční hmota atlasu"],["tuberculum posterius atlantis","zadní hrbolek atlasu"],["fovea dentis","jamka pro zub"],["sulcus arteriae vertebralis","rýha pro obratlovou tepnu"]]}]}},{"id":"t2","title":"📖 Stavba axisu","b":{"id":"t2","title":"Stavba axisu","img":"s29-000_lat.jpg","cap":"Axis (C2) zepředu a shora – Neumann 9.20, popisky v latině","html":"<p><b>Axis</b> (C2, <i>čepovec</i>) má na rozdíl od atlasu vysoké <b>tělo (corpus axis)</b>, ze kterého nahoru vybíhá kuželovitý <b>dens axis</b> (processus odontoideus). Dens je pevná svislá osa, kolem které se otáčí atlas i s hlavou. Rozlišujeme jeho hrot (<b>apex dentis</b>), zúžený krček (<b>collum dentis</b>) a vpředu <b>facies articularis anterior dentis</b>, která se kloubí s fovea dentis atlasu.</p>\n<p>Po stranách dentu leží velké, mírně konvexní <b>facies articulares superiores</b> se sklonem asi 20°; odpovídají dolním ploškám atlasu. Dolní kloubní výběžky (<b>processus articulares inferiores</b>) míří dopředu a dolů, takže kloub C2/C3 už je typický facetový kloub. Mezi C1 a C2 <b>není ploténka</b> – první disk je až C2/C3.</p>\n<p>Vzadu má axis mohutný, <b>rozdvojený trn (processus spinosus bifidus)</b> – je to první dobře hmatný trn pod týlem. Processus transversi jsou naopak krátké.</p>","fyzio":"<b>Zlomenina dentu.</b> Nejčastější a nejhůře se hojí zlomenina v <b>collum dentis</b> (typ II) – je nestabilní a hrozí útlak míchy. Proto se po úrazu krku (pád, autonehoda) krk nejdřív znehybní a do mobilizace nebo masáže se jde až po vyloučení zlomeniny. <b>Zlomenina oběšenců (hangman)</b> = oboustranná zlomenina pars interarticularis C2.","ex":[{"kind":"hot","title":"🖼️ Popiš obrázek: axis (Neumann 9.20)","img":"s29-000_lat.jpg","help":"Ťukni na oranžový box a napiš latinský název.","from":["b02",5],"items":[{"lat":"processus spinosus bifidus","cz":"rozdvojený trn","rects":[[0.8481,0.0884,0.1076,0.0884]]},{"lat":"lamina arcus vertebrae","cz":"ploténka oblouku","rects":[[0.5816,0.1861,0.1287,0.0375]]},{"lat":"processus articularis inferior","cz":"dolní kloubní výběžek","rects":[[0.8588,0.2262,0.1202,0.1272]]},{"lat":"facies articularis anterior dentis","cz":"přední kloubní ploška zubu","rects":[[0.0483,0.2423,0.1382,0.0656]]},{"lat":"dens axis","cz":"zub čepovce","rects":[[0.3181,0.2316,0.0543,0.0375],[0.8288,0.905,0.0543,0.0375]]},{"lat":"pediculus arcus vertebrae","cz":"stopka oblouku","rects":[[0.5149,0.2892,0.0875,0.0656]]},{"lat":"facies articularis superior","cz":"horní kloubní ploška","rects":[[0.0584,0.3561,0.0992,0.0817],[0.5164,0.8648,0.1224,0.1044]]},{"lat":"corpus axis","cz":"tělo čepovce","rects":[[0.216,0.7309,0.0646,0.0455]]},{"lat":"processus transversus","cz":"příčný výběžek","rects":[[0.8767,0.8139,0.1239,0.087]]}]},{"kind":"mcq","title":"❓ Kvíz","help":"Okamžitá zpětná vazba.","items":[["Co je dens axis embryonálně?",["tělo atlasu","trn atlasu","příčný výběžek C2","osifikovaný vaz"],0,""],["Který trn je první dobře hmatný pod týlem?",["C2","C1","C7","C3"],0,"C1 trn nemá, jen tuberculum posterius."],["Kde je první meziobratlová ploténka?",["C2/C3","C1/C2","C0/C1","C3/C4"],0,""]]},{"kind":"cloze","title":"🧩 Doplňovačka","help":"Doplň chybějící slovo.","items":["Zúžená část dentu pod hrotem se jmenuje {{collum dentis}}.","Facies articularis anterior dentis se kloubí s {{fovea dentis}} atlasu.","Processus spinosus axis je {{bifidus}} (rozdvojený)."]}]}},{"id":"t3","title":"📖 Klouby a vazy mezi lebkou, atlasem a axisem","b":{"id":"t3","title":"Klouby a vazy mezi lebkou, atlasem a axisem","img":"s16-000.jpg","cap":"Art. atlantoaxialis mediana shora – Neumann 9.21 (anglické popisky): dens leží v přední části prstence atlasu","html":"<p>Hlava se s páteří spojuje dvěma patry kloubů. <b>Articulatio atlantooccipitalis</b> (C0–C1) spojuje condyli occipitales s foveae articulares superiores atlasu. Umožňuje hlavně <b>kývání</b> (flexe–extenze, „ANO“) – celkem asi 15° – a trochu úklonu; rotace je tu zanedbatelná.</p>\n<p>Mezi atlasem a axisem jsou tři klouby. Párové <b>articulationes atlantoaxiales laterales</b> spojují dolní plošky atlasu s horními ploškami axisu. Nepárová <b>articulatio atlantoaxialis mediana</b> je čepový kloub mezi dentem a prstencem, který tvoří fovea dentis vpředu a vaz vzadu. Komplex C1–C2 dává asi 35–40° <b>rotace</b> na každou stranu („NE“), zhruba polovinu rotace krku.</p>\n<p>Dens drží na místě <b>lig. transversum atlantis</b>, napjaté za dentem mezi oběma massae laterales. Dělí páteřní kanál: dens je v přední třetině, mícha v zadních dvou třetinách. Spolu s podélnými snopci (fasciculi longitudinales) tvoří <b>lig. cruciforme atlantis</b> – hlavní stabilizátor dentu. Krátké silné <b>ligg. alaria</b> jdou z boků hrotu dentu ke condyli occipitales a brzdí rotaci; <b>lig. apicis dentis</b> vede z hrotu k okraji foramen magnum. Zezadu vše kryje <b>membrana tectoria</b>, kraniální pokračování lig. longitudinale posterius z těla C2 na clivus.</p>","fyzio":"<b>Atlantoaxiální instabilita.</b> Na bočném RTG se měří vzdálenost mezi předním obloukem atlasu a dentem (ADI) – normálně &lt; 3 mm u dospělých, &lt; 5 mm u dětí. Rozšíření znamená poškození lig. transversum atlantis. Rizikoví jsou např. pacienti s revmatoidní artritidou nebo Downovým syndromem. A. vertebralis se v krajní extenzi s rotací může zúžit – proto se před mobilizací horní krční páteře dělá bezpečnostní vyšetření.","ex":[{"kind":"match","title":"🔗 Přiřazovačka: klouby a vazy","help":"Ťukni na latinský termín a pak na jeho popis.","items":[["articulatio atlantooccipitalis","kloub C0–C1, kývání „ANO“"],["articulatio atlantoaxialis mediana","čepový kloub dens–atlas"],["articulatio atlantoaxialis lateralis","párový kloub plošek C1–C2"],["lig. transversum atlantis","příčný vaz za dentem"],["ligg. alaria","křídlaté vazy, brzdí rotaci"],["membrana tectoria","pokračování lig. longitudinale posterius"],["lig. apicis dentis","vaz hrotu zubu k foramen magnum"]]},{"kind":"mcq","title":"❓ Kvíz","help":"Okamžitá zpětná vazba.","items":[["Který vaz je hlavní stabilizátor dentu?",["lig. transversum atlantis","ligg. alaria","lig. nuchae","membrana tectoria"],0,"Spolu s fasciculi longitudinales tvoří lig. cruciforme."],["Pohyb „ANO“ (kývání) probíhá hlavně v…",["art. atlantooccipitalis","art. atlantoaxialis mediana","kloubu C2/C3","art. atlantoaxialis lateralis"],0,""],["Co brzdí nadměrnou rotaci hlavy s atlasem?",["ligg. alaria","lig. apicis dentis","ligg. flava","membrana atlantooccipitalis anterior"],0,"„Check ligaments“."]]},{"kind":"cloze","title":"🧩 Doplňovačka","help":"Doplň chybějící slovo.","items":["Lig. transversum atlantis + fasciculi longitudinales = {{lig. cruciforme}} atlantis.","Membrana tectoria je kraniální pokračování {{lig. longitudinale posterius}}.","Komplex C1–C2 dává asi {{35–40°}} rotace na každou stranu."]}]}},{"id":"rev","title":"🎓 Závěrečný mix – celá kapitola","ex":[{"id":"rev","title":"🎓 Závěrečný mix – celá kapitola","kind":"mcq","help":"Otázky napříč všemi bloky.","items":[["Která část atlasu nese fovea dentis?",["arcus anterior","arcus posterior","massa lateralis","processus transversus"],0,""],["Co prochází foramen transversarium?",["a. et v. vertebralis","n. vagus","a. carotis interna","mícha"],0,""],["Massae laterales atlasu…",["přenášejí váhu hlavy na axis","tvoří trn","obsahují fovea dentis","jsou z chrupavky"],0,""],["Nejčastější a nestabilní

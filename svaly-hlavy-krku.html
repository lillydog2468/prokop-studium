<script>window.LESSON={"key": "anat_svaly_hk_study_v1", "sections": [{"id": "intro", "title": "🏁 Start – jak na to", "html": "<p><b>Svaly hlavy a krku</b> podle prezentací <i>Svaly hlavy</i> a <i>Svaly krku</i> (Maja Špiritović). U každého svalu: začátek – úpon – funkce – inervace tak, jak jsou na slidech.</p>\n<p><b>Postup v každém bloku:</b> výklad + tipy → video (volitelné) → animace → 🔗 přiřazovačka → ✍️ latina psaním → 🧩 doplňovačka → ❓ kvíz → 🖼️ popis obrázku (klikni na oranžový box a napiš latinsky) → 🃏 flashcards → 🧠 Anki pauza.</p>\n<p>Na konci je <b>🎓 zápočtový test</b> (28 otázek, pokaždé jiné). Postup i čas se ukládají v prohlížeči. Stopky spustíš ▶ nahoře.</p>\n<p>Anki: deck <code>Anatomie::Svaly hlavy a krku</code> – 8 subdecků, doplňovačky, psaní latiny a okluze obrázků (funguje i v AnkiMobile).</p>", "tips": ["Psaní latiny: diakritika a velká písmena se nekontrolují, malý překlep u dlouhých slov se uzná."]}, {"id": "b01", "title": "01 Žvýkací svaly", "sub": "Maja Špiritović – Svaly hlavy", "html": "<p><b>Mm. masticatorii</b> hýbou dolní čelistí – hlavně <b>elevace</b> (zavření úst), dále pohyb dopředu, dozadu, do boku a rotace kolem svislé osy (kousání). <b>Inervace: n. trigeminus (n. V).</b></p>\n<table class=\"tt\"><tr><th>Sval</th><th>Začátek</th><th>Úpon</th><th>Funkce</th></tr>\n<tr><td>m. masseter (žvýkací)</td><td>arcus zygomaticus</td><td>tuberositas masseterica + ramus mandibulae</td><td>bilat.: elevace + protrakce; unilat.: ipsilaterální pohyb mandibuly; sání (kojenec)</td></tr>\n<tr><td>m. temporalis (spánkový)</td><td>fossa temporalis</td><td>proc. coronoideus mandibulae</td><td>elevace + retrakce; posturální funkce</td></tr>\n<tr><td>m. pterygoideus medialis (vnitřní křídlovitý)</td><td>fossa pterygoidea, tuber maxillae</td><td>angulus mandibulae + tuberositas pterygoidea</td><td>elevace, pomocná protrakce, žvýkání</td></tr>\n<tr><td>m. pterygoideus lateralis (vnější křídlovitý)</td><td>crista infratemporalis alae majoris, lamina lat. proc. pterygoidei</td><td>fovea pterygoidea</td><td>protrakce, žvýkací pohyby</td></tr></table>\n<p class=\"nt\">Na úvod obou prezentací: pohybový systém = funkční celky – posturální, lokomoční, manipulační, komunikační a logistické systémy.</p>", "tips": ["Žvýkací = „pětka“: všechny 4 inervuje n. V (trigeminus) – mimické mají „sedmičku“ (n. VII).", "Masseter si nahmatáš na úhlu čelisti, temporalis ve spánku – zatni zuby a ucítíš je.", "Jediný sval, který jen <b>předsouvá</b> (nezvedá), je m. pterygoideus <b>lateralis</b> – „laterální = letí dopředu“.", "Temporalis = elevace + <b>retrakce</b> (zadní vlákna táhnou čelist dozadu)."], "videos": [["uEP4wYX01eo", "Muscles of Mastication – Anatomy Tutorial", "AnatomyZone"], ["cZ1Iu8YOfEw", "Muscles of mastication", "Kenhub"], ["F_O0Rj3IWn8", "Muscles of the Head & Neck – model", "Ninja Nerd"]], "anim": "jaw", "ex": [{"kind": "match", "title": "🔗 Přiřazovačka (latina ↔ čeština)", "help": "Ťukni na latinský termín a pak na český (nebo obráceně). Ťuknutím na spojený pár ho zrušíš. Vybírá se 8 náhodných termínů.", "items": [["žvýkací svaly", "mm. masticatorii"], ["žvýkací sval", "m. masseter"], ["spánkový sval", "m. temporalis"], ["vnitřní křídlovitý sval", "m. pterygoideus medialis"], ["vnější křídlovitý sval", "m. pterygoideus lateralis"], ["jařmový oblouk", "arcus zygomaticus"], ["spánková jáma", "fossa temporalis"], ["svalový výběžek dolní čelisti", "processus coronoideus mandibulae"], ["úhel dolní čelisti", "angulus mandibulae"], ["větev dolní čelisti", "ramus mandibulae"], ["křídlovitá jamka (začátek m. pteryg. med.)", "fossa pterygoidea"], ["křídlovitá jamka na krčku mandibuly (úpon m. pteryg. lat.)", "fovea pterygoidea"]]}, {"kind": "type", "title": "✍️ Čeština → latina", "help": "Napiš latinsky, Enter skočí na další.", "items": [["žvýkací svaly", "mm. masticatorii"], ["žvýkací sval", "m. masseter"], ["spánkový sval", "m. temporalis"], ["vnitřní křídlovitý sval", "m. pterygoideus medialis"], ["vnější křídlovitý sval", "m. pterygoideus lateralis"], ["jařmový oblouk", "arcus zygomaticus"], ["spánková jáma", "fossa temporalis"], ["svalový výběžek dolní čelisti", "processus coronoideus mandibulae"], ["úhel dolní čelisti", "angulus mandibulae"], ["větev dolní čelisti", "ramus mandibulae"], ["křídlovitá jamka (začátek m. pteryg. med.)", "fossa pterygoidea"], ["křídlovitá jamka na krčku mandibuly (úpon m. pteryg. lat.)", "fovea pterygoidea"]]}, {"kind": "cloze", "title": "🧩 Doplňovačka (fakta ze slidů)", "help": "Doplň vynechané slovo/číslo. Pokaždé se vynechá něco jiného.", "items": ["Žvýkací svaly (mm. masticatorii) inervuje {{c1::n. trigeminus (n. V)}}.", "Hlavním pohybem žvýkacích svalů je {{c1::elevace}} dolní čelisti.", "M. masseter začíná na {{c1::arcus zygomaticus}} a upíná se na {{c2::tuberositas masseterica}} a ramus mandibulae.", "Oboustranná kontrakce m. masseter = {{c1::elevace}} + {{c2::protrakce}} mandibuly.", "Jednostranná kontrakce m. masseter = {{c1::ipsilaterální}} pohyb mandibuly.", "M. masseter se uplatňuje při {{c1::sání}}, např. u kojence.", "M. temporalis začíná ve {{c1::fossa temporalis}} a upíná se na {{c2::processus coronoideus}} mandibulae.", "M. temporalis provádí elevaci a {{c1::retrakci}} dolní čelisti a má {{c2::posturální}} funkci.", "M. pterygoideus medialis začíná ve {{c1::fossa pterygoidea}} a na tuber maxillae.", "M. pterygoideus medialis se upíná na {{c1::angulus mandibulae}} a tuberositas pterygoidea.", "M. pterygoideus lateralis začíná na {{c1::crista infratemporalis}} alae majoris a lamina lateralis proc. pterygoidei.", "M. pterygoideus lateralis se upíná do {{c1::fovea pterygoidea}} a provádí {{c2::protrakci}} dolní čelisti.", "Pohybový systém tvoří funkční celky: posturální, {{c1::lokomoční}}, manipulační, {{c2::komunikační}} a logistické."]}, {"kind": "mcq", "title": "❓ Kvíz", "help": "Okamžitá zpětná vazba.", "items": [["Který nerv inervuje žvýkací svaly?", ["n. trigeminus (V)", "n. facialis (VII)", "n. hypoglossus (XII)", "n. accessorius (XI)"], 0, "mm. masticatorii = n. V"], ["Kde se upíná m. temporalis?", ["processus coronoideus mandibulae", "angulus mandibulae", "fovea pterygoidea", "arcus zygomaticus"], 0, ""], ["Který žvýkací sval podle slidů hlavně provádí protrakci a nezvedá čelist?", ["m. pterygoideus lateralis", "m. masseter", "m. temporalis", "m. pterygoideus medialis"], 0, ""], ["Co dělá m. temporalis?", ["elevace + retrakce", "deprese + protrakce", "jen laterální pohyb", "deprese"], 0, "+ posturální funkce"], ["Začátek m. masseter?", ["arcus zygomaticus", "fossa temporalis", "fossa pterygoidea", "processus mastoideus"], 0, ""], ["Úpon m. pterygoideus medialis?", ["angulus mandibulae + tuberositas pterygoidea", "fovea pterygoidea", "processus coronoideus", "tuberositas masseterica"], 0, ""], ["Jednostranná kontrakce m. masseter způsobí…", ["ipsilaterální pohyb mandibuly", "kontralaterální pohyb mandibuly", "depresi", "retrakci"], 0, ""]]}, {"kind": "hot", "title": "🖼️ Popiš obrázek: Žvýkací svaly – Obličej – hluboká vrstva, z boku", "help": "Klikni na oranžový box a napiš latinský název. Zelená = správně. Zdroj: Sobotta, Atlas of Human Anatomy (1909), public domain – Wikimedia Commons; popisky přeloženy do latiny (moderní nomenklatura).", "img": "m266_lat.jpg", "items": [{"lat": "m. temporalis", "cz": "spánkový sval", "rects": [[0.6673, 0.2071, 0.0875, 0.0274]]}, {"lat": "m. pterygoideus lateralis", "cz": "vnější křídlovitý sval", "rects": [[0.5745, 0.4685, 0.1691, 0.0274]]}, {"lat": "m. pterygoideus medialis", "cz": "vnitřní křídlovitý sval", "rects": [[0.6081, 0.635, 0.1719, 0.0274]]}]}, {"kind": "flash", "title": "🃏 Flashcards", "help": "Otoč, ohodnoť se, neznámé se zopakují.", "items": [["žvýkací svaly", "mm. masticatorii"], ["žvýkací sval", "m. masseter"], ["spánkový sval", "m. temporalis"], ["vnitřní křídlovitý sval", "m. pterygoideus medialis"], ["vnější křídlovitý sval", "m. pterygoideus lateralis"], ["jařmový oblouk", "arcus zygomaticus"], ["spánková jáma", "fossa temporalis"], ["svalový výběžek dolní čelisti", "processus coronoideus mandibulae"], ["úhel dolní čelisti", "angulus mandibulae"], ["větev dolní čelisti", "ramus mandibulae"], ["křídlovitá jamka (začátek m. pteryg. med.)", "fossa pterygoidea"], ["křídlovitá jamka na krčku mandibuly (úpon m. pteryg. lat.)", "fovea pterygoidea"]]}]}, {"id": "a01", "kind": "anki", "title": "🧠 Anki pauza 01", "deck": "Anatomie::Svaly hlavy a krku::01 Žvýkací svaly"}, {"id": "b02", "title": "02 Mimické svaly – oko, nos, lební klenba", "sub": "Maja Špiritović – Svaly hlavy", "html": "<p><b>Mm. faciales</b> leží převážně v podkoží obličeje, probíhají v podkožním vazivu a <b>nemají fascii</b>. Upínají se do kůže, kterou pohybují (řasy, rýhy, jamky). Ovládají otvory hlavy (uzavírají, rozevírají, mění tvar), jsou svaly výrazové/sdělovací – expresivní složka řeči a neverbální komunikace; klidové napětí určuje individuální výraz. <b>Inervace: n. facialis (n. VII).</b></p>\n<ul><li><b>Svaly oční štěrbiny:</b> m. orbicularis oculi – zavírá víčka a pohybuje obočím; m. procerus – deprese obočí a čela, příčná vráska na kořeni nosu („přísnost“); m. corrugator supercilii – deprese obočí, svislé rýhy v glabele (zamračenost, bolest).</li>\n<li><b>Svaly zevního nosu:</b> m. nasalis – deprese nosní přepážky, abdukce chrupavky, rozšíření nosní dírky; m. depressor septi nasi – deprese nosní přepážky.</li>\n<li><b>Svaly lební klenby:</b> m. epicranius se upíná do <i>galea aponeurotica</i>; vpředu m. frontalis (kůže čela vzhůru – pozornost/hrůza, vrásky na čele), vzadu m. occipitalis (pohyb skalpu).</li>\n<li><b>Svaly ušního boltce</b> – u člověka rudimentární.</li></ul>", "tips": ["Mimické = „sedmička“: n. facialis (VII). Obrna n. VII → povislý koutek, nedovřené oko.", "Procerus = příčná vráska („přísný“), corrugator = svislé vrásky („zamračený“).", "Frontalis zvedá obočí – „překvapení/hrůza“; obě bříška m. epicranius spojuje galea aponeurotica."], "videos": [["Xmz3oLrnzBw", "Muscles of Facial Expression – Part 1", "AnatomyZone"], ["RhbSNQUC2tI", "The muscles of facial expression", "Anatomy For The People"]], "anim": "face", "ex": [{"kind": "match", "title": "🔗 Přiřazovačka (latina ↔ čeština)", "help": "Ťukni na latinský termín a pak na český (nebo obráceně). Ťuknutím na spojený pár ho zrušíš. Vybírá se 8 náhodných termínů.", "items": [["mimické svaly", "mm. faciales"], ["kruhový sval oční", "m. orbicularis oculi"], ["sval hrdý (příčná vráska kořene nosu)", "m. procerus"], ["svraštělec obočí", "m. corrugator supercilii"], ["nosní sval", "m. nasalis"], ["stlačovač nosní přepážky", "m. depressor septi nasi"], ["sval lební klenby", "m. epicranius"], ["vazivová přilba lební", "galea aponeurotica"], ["čelní sval", "m. frontalis"], ["týlní sval", "m. occipitalis"]]}, {"kind": "type", "title": "✍️ Čeština → latina", "help": "Napiš latinsky, Enter skočí na další.", "items": [["mimické svaly", "mm. faciales"], ["kruhový sval oční", "m. orbicularis oculi"], ["sval hrdý (příčná vráska kořene nosu)", "m. procerus"], ["svraštělec obočí", "m. corrugator supercilii"], ["nosní sval", "m. nasalis"], ["stlačovač nosní přepážky", "m. depressor septi nasi"], ["sval lební klenby", "m. epicranius"], ["vazivová přilba lební", "galea aponeurotica"], ["čelní sval", "m. frontalis"], ["týlní sval", "m. occipitalis"]]}, {"kind": "cloze", "title": "🧩 Doplňovačka (fakta ze slidů)", "help": "Doplň vynechané slovo/číslo. Pokaždé se vynechá něco jiného.", "items": ["Mimické svaly inervuje {{c1::n. facialis (n. VII)}}.", "Mimické svaly nemají {{c1::fascii}} a upínají se do {{c2::kůže}}.", "M. {{c1::orbicularis oculi}} zavírá oční víčka a pohybuje obočím.", "M. {{c1::procerus}} vytváří příčnou vrásku na kořeni nosu (přísný výraz).", "M. {{c1::corrugator supercilii}} vytváří svislé rýhy v oblasti glabely – zamračenost, bolest.", "M. {{c1::nasalis}} rozšiřuje nosní dírku a abdukuje chrupavku.", "M. {{c1::depressor septi nasi}} provádí depresi nosní přepážky.", "M. epicranius se upíná do vazivové přilby {{c1::galea aponeurotica}}.", "M. {{c1::frontalis}} táhne kůži čela vzhůru – výraz pozornosti/hrůzy.", "M. {{c1::occipitalis}} se upíná do galea zezadu a pohybuje skalpem.", "Svaly ušního boltce jsou u člověka {{c1::rudimentární}}."]}, {"kind": "mcq", "title": "❓ Kvíz", "help": "Okamžitá zpětná vazba.", "items": [["Který sval vytváří svislé rýhy v glabele (zamračení)?", ["m. corrugator supercilii", "m. procerus", "m. frontalis", "m. nasalis"], 0, ""], ["Inervace mimických svalů?", ["n. facialis (VII)", "n. trigeminus (V)", "n. oculomotorius (III)", "plexus cervicalis"], 0, ""], ["Kam se upíná m. epicranius?", ["galea aponeurotica", "fascia temporalis", "os frontale", "processus mastoideus"], 0, ""], ["Výraz pozornosti/hrůzy a vrásky na čele vytváří…", ["m. frontalis", "m. occipitalis", "m. procerus", "m. orbicularis oculi"], 0, ""], ["Co platí pro mimické svaly?", ["nemají fascii a upínají se do kůže", "mají silnou fascii", "upínají se jen na kosti", "inervuje je n. V"], 0, ""]]}, {"kind": "hot", "title": "🖼️ Popiš obrázek: Mimické svaly – oko, nos, lební klenba – Obličej – hluboká vrstva, z boku", "help": "Klikni na oranžový box a napiš latinský název. Zelená = správně. Zdroj: Sobotta, Atlas of Human Anatomy (1909), public domain – Wikimedia Commons; popisky přeloženy do latiny (moderní nomenklatura).", "img": "m266_lat.jpg", "items": [{"lat": "m. frontalis", "cz": "čelní sval", "rects": [[0.3542, 0.0776, 0.069, 0.0274]]}, {"lat": "m. corrugator supercilii", "cz": "svraštělec obočí", "rects": [[0.4117, 0.1053, 0.0865, 0.0462]]}, {"lat": "m. orbicularis oculi", "cz": "kruhový sval oční", "rects": [[0.3795, 0.2213, 0.125, 0.0274]]}, {"lat": "m. procerus", "cz": "sval hrdý", "rects": [[0.1116, 0.3119, 0.0734, 0.0274]]}, {"lat": "m. nasalis", "cz": "nosní sval", "rects": [[0.219, 0.3754, 0.06, 0.0274]]}]}, {"kind": "hot", "title": "🖼️ Popiš obrázek: Mimické svaly – oko, nos, lební klenba – Obličej a hlava – povrchová vrstva, z boku", "help": "Klikni na oranžový box a napiš latinský název. /ul>\n<p><b>M. buccinator</b> přitlačuje tvář k zubům – „trubačský sval“. <b>Platysma</b> – povrchový sval krku, sahá až k mimickým svalům dolního rtu (viz blok 04).</p>\n<p><b>Fascie hlavy</b> netvoří souvislou vrstvu – jen tři: fascia temporalis, fascia masseterica, fascia buccopharyngea.</p>", "tips": ["„Levator“ = zvedá, „depressor“ = stahuje dolů; „anguli oris“ = koutek, „labii“ = ret.", "Buccinator = trubač (bucca = tvář): fouká, drží sousto mezi zuby.", "Mentalis = „sval pýchy“ – našpulený dolní ret.", "Starší atlasy: caninus = levator anguli oris, triangularis = depressor anguli oris, quadratus labii inf. = depressor labii inferioris."], "videos": [["RhbSNQUC2tI", "The muscles of facial expression", "Anatomy For The People"], ["7dOE_VIPfn0", "Muscles of facial expressions", "Enamel Edge"]], "anim": "face", "ex": [{"kind": "match", "title": "🔗 Přiřazovačka (latina ↔ čeština)", "help": "Ťukni na latinský termín a pak na český (nebo obráceně). Ťuknutím na spojený pár ho zrušíš. Vybírá se 8 náhodných termínů.", "items": [["kruhový sval ústní", "m. orbicularis oris"], ["velký sval jařmový", "m. zygomaticus major"], ["malý sval jařmový", "m. zygomaticus minor"], ["sval smíchu", "m. risorius"], ["zdvihač horního rtu", "m. levator labii superioris"], ["zdvihač horního rtu a nosního křídla", "m. levator labii superioris alaeque nasi"], ["zdvihač ústního koutku", "m. levator anguli oris"], ["stlačovač dolního rtu", "m. depressor labii inferioris"], ["stlačovač ústního koutku", "m. depressor anguli oris"], ["bradový sval (sval pýchy)", "m. mentalis"], ["tvářový (trubačský) sval", "m. buccinator"], ["spánková fascie", "fascia temporalis"], ["žvýkací fascie", "fascia masseterica"], ["tvářohltanová fascie", "fascia buccopharyngea"]]}, {"kind": "type", "title": "✍️ Čeština → latina", "help": "Napiš latinsky, Enter skočí na další.", "items": [["kruhový sval ústní", "m. orbicularis oris"], ["velký sval jařmový", "m. zygomaticus major"], ["malý sval jařmový", "m. zygomaticus val (sval pýchy)", "m. mentalis"], ["tvářový (trubačský) sval", "m. buccinator"], ["spánková fascie", "fascia temporalis"], ["žvýkací fascie", "fascia masseterica"], ["tvářohltanová fascie", "fascia buccopharyngea"]]}]}, {"id": "a03", "kind": "anki", "title": "🧠 Anki pauza 03", "deck": "Anatomie::Svaly hlavy a krku::03 Mimické svaly – ústa a tvář"}, {"id": "b04", "title": "04 Krk – členění, povrchové svaly, fascie", "sub": "Maja Špiritović – Svaly krku", "html": "<p>Přední okraj <b>m. trapezius</b> dělí krk na zadní oddíl – <b>šíji (nucha)</b> – a laterální přední oddíl – <b>krk (collum, cervix)</b>. <b>Mm. colli</b> se dělí na: povrchové, nadjazylkové a podjazylkové, šikmé (skalenové), prevertebrální a meziobratlové.</p>\n<table class=\"tt\"><tr><th>Sval</th><th>Začátek</th><th>Úpon</th><th>Funkce</th><th>Inervace</th></tr>\n<tr><td>platysma</td><td>pod klavikulou – povrchová hrudní fascie, fascie deltového svalu</td><td>p. mandibularis (dolní okraj mandibuly), p. labialis (lat. část dolního rtu), p. modiolaris (tvář, koutek)</td><td>kontraktilní orgán kůže, při hlubokém a náhlém nádechu, stahuje koutek a dolní čelist</td><td>n. facialis</td></tr>\n<tr><td>m. sternocleidomastoideus</td><td>sternoklavikulární kloub – dvě hlavy</td><td>proc. mastoideus + linea nuchae superior</td><td>jednostr.: otáčí obličej na <b>opačnou</b> stranu + uklání hlavu na <b>stejnou</b>; oboustr.: záklon i předklon hlavy</td><td>n. accessorius (XI) + plexus cervicalis C2–C3</td></tr></table>\n<p><b>Fascia colli – 3 listy:</b> lamina superficialis (obaluje povrchové svaly kromě platysmatu; na šíji = fascia nuchae), lamina pretrachealis (před tracheou, kryje infrahyoidní svaly), lamina prevertebralis (kryje prevertebrální svaly).</p>", "tips": ["SCM = největší sval krku. Pravý SCM otočí obličej <b>doleva</b> a ukloní hlavu <b>doprava</b> (vyzkoušej animaci).", "SCM je jediný sval krku s n. XI (+ C2–C3) – spolu s trapeziem.", "Platysma je kožní sval → inervuje ho n. VII jako mimické svaly.", "3 listy fascia colli: „povrch – před průdušnicí – před páteří“."], "videos": [["-pm3G_nAqJc", "Sternocleidomastoid muscle explained", "Kenhub"], ["F_O0Rj3IWn8", "Muscles of the Head & Neck – model", "Ninja Nerd"]], "anim": "scm", "ex": [{"kind": "match", "title": "🔗 Přiřazovačka (latina ↔ čeština)", "help": "Ťukni na latinský termín a pak na český (nebo obráceně). Ťuknutím na spojený pár ho zrušíš. Vybírá se 8 náhodných termínů.", "items": [["svaly krku", "mm. colli"], ["šíje", "nucha"], ["krk", "collum (cervix)"], ["podkožní sval krku", "platysma"], ["kývač hlavy (zdvihač hlavy)", "m. sternocleidomastoideus"], ["bradavkový výběžek", "processus mastoideus"], ["horní šíjová čára", "linea nuchae superior"], ["povrchový list krční fascie", "lamina superficialis fasciae colli"], ["předprůdušnicový list", "lamina pretrachealis"], ["předpáteřní list", "lamina prevertebralis"], ["šíjová fascie", "fascia nuchae"]]}, {"kind": "type", "title": "✍️ Čeština → latina", "help": "Napiš latinsky, Enter skočí na další.", "items": [["svaly krku", "mm. colli"], ["šíje", "nucha"], ["krk", "collum (cervix)"], ["podkožní sval krku", "platysma"], ["kývač hlavy (zdvihač hlavy)", "m. sternocleidomastoideus"], ["bradavkový výběžek", "processus mastoideus"], ["horní šíjová čára", "linea nuchae superior"], ["povrchový list krční fascie", "lamina superficialis fasciae colli"], ["předprůdušnicový list", "lamina pretrachealis"], ["předpáteřní list", "lamina prevertebralis"], ["šíjová fascie", "fascia nuchae"]]}, {"kind": "cloze", "title": "🧩 Doplňovačka (fakta ze slidů)", "help": "Doplň vynechané slovo/číslo. Pokaždé se vynechá něco jiného.", "items": ["Přední okraj m. {{c1::trapezius}} dělí krk na šíji (nucha) a krk (collum).", "Platysma inervuje {{c1::n. facialis}}.", "Platysma začíná pod {{c1::klavikulou}} od povrchové hrudní fascie a fascie deltového svalu.", "M. sternocleidomastoideus začíná na {{c1::sternoklavikulárním}} kloubu dvěma hlavami.", "M. sternocleidomastoideus se upíná na {{c1::processus mastoideus}} a {{c2::linea nuchae superior}}.", "Jednostranná akce SCM otáčí obličej na {{c1::opačnou}} stranu a naklání hlavu na {{c2::stejnou}} stranu.", "Oboustranná akce SCM = {{c1::záklon i předklon}} hlavy.", "SCM inervuje {{c1::n. accessorius (n. XI)}} a větve plexus cervicalis {{c2::C2 a C3}}.", "M. sternocleidomastoideus je {{c1::nejmohutnější}} sval krku.", "Fascia colli má {{c1::tři}} listy.", "Povrchový list fascia colli se na šíji nazývá {{c1::fascia nuchae}}.", "Lamina {{c1::pretrachealis}} kryje infrahyoidní svaly.", "Lamina {{c1::prevertebralis}} kryje prevertebrální svaly."]}, {"kind": "mcq", "title": "❓ Kvíz", "help": "Okamžitá zpětná vazba.", "items": [["Pravý m. sternocleidomastoideus (jednostranně) otočí obličej…", ["doleva a ukloní hlavu doprava", "doprava a ukloní hlavu doprava", "doleva a ukloní hlavu doleva", "jen předkloní hlavu"], 0, "rotace na opačnou, úklon na stejnou stranu"], ["Inervace SCM?", ["n. accessorius + C2–C3", "n. facialis", "n. hypoglossus", "rr. ventrales C3–C8"], 0, ""], ["Inervace platysmatu?", ["n. facialis", "n. accessorius", "plexus cervicalis", "n. trigeminus"], 0, ""], ["Úpon SCM?", ["proc. mastoideus + linea nuchae superior", "linea nuchae inferior", "1. žebro", "os hyoideum"], 0, ""], ["Který list fascia colli kryje infrahyoidní svaly?", ["lamina pretrachealis", "lamina superficialis", "lamina prevertebralis", "fascia nuchae"], 0, ""], ["Která skupina NEpatří do členění svalů krku podle slidů?", ["žvýkací svaly", "prevertebrální", "meziobratlové", "nadjazylkové a podjazylkové"], 0, ""]]}, {"kind": "hot", "title": "🖼️ Popiš obrázek: Povrchové svaly krku – Krk z boku", "help": "Klikni na oranžový box a napiš latinský název. Zelená = správně. Zdroj: Sobotta, Atlas of Human Anatomy (1909), public domain – Wikimedia Commons; popisky přeloženy do latiny (moderní nomenklatura).", "img": "m256_lat.jpg", "items": [{"lat": "m. sternocleidomastoideus", "cz": "kývač hlavy", "rects": [[0.3782, 0.5622, 0.2359, 0.0256]]}]}, {"kind": "flash", "title": "🃏 Flashcards", "help": "Otoč, ohodnoť se, neznámé se zopakují.", "items": [["svaly krku", "mm. colli"], ["šíje", "nucha"], ["krk", "collum (cervix)"], ["podkožní sval krku", "platysma"], ["kývač hlavy (zdvihač hlavy)", "m. sternocleidomastoideus"], ["bradavkový výběžek", "processus mastoideus"], ["horní šíjová čára", "linea nuchae superior"], ["povrchový list krční fascie", "lamina superficialis fasciae colli"], ["předprůdušnicový list", "lamina pretrachealis"], ["předpáteřní list", "lamina prevertebralis"], ["šíjová fascie", "fascia nuchae"]]}]}, {"id": "a04", "kind": "anki", "title": "🧠 Anki pauza 04", "deck": "Anatomie::Svaly hlavy a krku::04 Krk – členění, povrchové svaly, fascie"}, {"id": "b05", "title": "05 Nadjazylkové a podjazylkové svaly", "sub": "Maja Špiritović – Svaly krku", "html": "<p><b>Mm. suprahyoidei</b> spojují jazylku s lebečními kostmi, umožňují pohyb jazylky a <b>depresi dolní čelisti</b> (otevření úst):</p>\n<ul><li>m. digastricus (n. VII)</li><li>m. stylohyoideus (n. VII)</li><li>m. mylohyoideus – dno ústní dutiny (n. V)</li><li>m. geniohyoideus (C1 a C2 cestou n. XII)</li></ul>\n<p><b>Mm. infrahyoidei</b> spojují jazylku s kostí hrudní, lopatkou a hrtanem. Fixují jazylku a táhnou ji kaudálně, podílí se na funkci hlasové, dechu a zpěvu (mění polohu hrtanu → výšku vokálů). <b>Inervace: větev n. hypoglossus a C1–C3</b> (= ansa cervicalis).</p>\n<ul><li>m. thyrohyoideus</li><li>m. sternothyroideus</li><li>m. sternohyoideus</li><li>m. omohyoideus</li></ul>", "tips": ["Nadjazylkové: „Dva Styly My Geniální“ – Digastricus, Stylohyoideus, Mylohyoideus, Geniohyoideus.", "Inervace nadjazylkových: „7-7-5-12“: digastricus a stylohyoideus VII, mylohyoideus V, geniohyoideus C1–C2 přes XII. (Digastricus má v klasické anatomii přední bříško z n. V – slidy uvádějí n. VII.)", "Podjazylkové = 4 „S-T-O-ry“: Sternohyoideus, Sternothyroideus, Thyrohyoideus, Omohyoideus (omos = rameno → lopatka).", "Názvy říkají začátek a úpon: ste ["-kLOUPn85l8", "SCM + scalene muscles", "Medicosis Perfectionalis"]], "anim": "scal", "ex": [{"kind": "match", "title": "🔗 Přiřazovačka (latina ↔ čeština)", "help": "Ťukni na latinský termín a pak na český (nebo obráceně). Ťuknutím na spojený pár ho zrušíš. Vybírá se 8 náhodných termínů.", "items": [["kloněné (skalenové) svaly", "mm. scaleni"], ["přední sval kloněný", "m. scalenus anterior"], ["střední sval kloněný", "m. scalenus medius"], ["zadní sval kloněný", "m. scalenus posterior"], ["skalenová štěrbina", "fissura scalenorum"], ["podklíčková tepna", "a. subclavia"], ["pažní pleteň", "plexus brachialis"], ["příčný výběžek", "processus transversus"]]}, {"kind": "type", "title": "✍️ Čeština → latina", "help": "Napiš latinsky, Enter skočí na další.", "items": [["kloněné (skalenové) svaly", "mm. scaleni"], ["přední sval kloněný", "m. scalenus anterior"], ["střední sval kloněný", "m. scalenus medius"], ["zadní sval kloněný", "m. scalenus posterior"], ["skalenová štěrbina", "fissura scalenorum"], ["podklíčková tepna", "a. subclavia"], ["pažní pleteň", "plexus brachialis"], ["příčný výběžek", "processus transversus"]]}, {"kind": "cloze", "title": "🧩 Doplňovačka (fakta ze slidů)", "help": "Doplň vynechané slovo/číslo. Pokaždé se vynechá něco jiného.", "items": ["Mm. scaleni začínají na {{c1::processus transversi C2–C7}}.", "Mm. scaleni se upínají na {{c1::1. a 2.}} žebro.", "Jednostranná akce mm. scaleni = úklon Cp na stranu a otočení na stranu {{c1::opačnou}}.", "Oboustranně mm. scaleni zvedají žebra jako pomocné {{c1::nádechové}} svaly.", "Mm. scaleni inervují {{c1::rr. ventrales}} nn. cervicalium {{c2::C3–C8}}.", "M. scalenus {{c1::anterior}} et {{c2::medius}} ohraničují fissura scalenorum.", "Fissura scalenorum prochází {{c1::a. subclavia}} a kraniálně {{c2::plexus brachialis}}.", "Zúžení fissura scalenorum → {{c1::skalenový syndrom}} (sy. horní hrudní apertury)."]}, {"kind": "mcq", "title": "❓ Kvíz", "help": "Okamžitá zpětná vazba.", "items": [["Co prochází fissura scalenorum?", ["a. subclavia a plexus brachialis", "v. jugularis interna", "n. accessorius", "a. carotis communis"], 0, ""], ["Úpon mm. scaleni?", ["1. a 2. žebro", "clavicula", "proc. mastoideus", "os hyoideum"], 0, ""], ["Které svaly ohraničují fissura scalenorum?", ["scalenus anterior a medius", "scalenus medius a posterior", "SCM a trapezius", "longus colli a capitis"], 0, ""], ["Inervace mm. scaleni podle slidů?", ["rr. ventrales C3–C8", "n. XI", "n. VII", "n. suboccipitalis"], 0, ""], ["Oboustranná akce scalenů při dýchání?", ["zvedají žebra (inspirium)", "stahují žebra (exspirium)", "žádná", "stahují bránici"], 0, ""]]}, {"kind": "hot", "title": "🖼️ Popiš obrázek: Skalenové svaly – Prevertebrální svaly krku zepředu", "help": "Klikni na oranžový box a napiš latinský název. Zelená = správně. Zdroj: Sobotta, Atlas of Human Anatomy (1909), public domain – Wikimedia Commons; popisky přeloženy do latiny (moderní nomenklatura).", "img": "m259_lat.jpg", "items": [{"lat": "m. scalenus anterior", "cz": "přední sval kloněný", "rects": [[0.6529, 0.5667, 0.0973, 0.0432]]}, {"lat": "m. scalenus medius", "cz": "střední sval kloněný", "rects": [[0.7564, 0.6401, 0.0973, 0.0432]]}]}, {"kind": "hot", "title": "🖼️ Popiš obrázek: Skalenové svaly – Krk z boku", "help": "Klikni na oranžový box a napiš latinský název. Zelená = správně. Zdroj: Sobotta, Atlas of Human Anatomy (1909), public domain – Wikimedia Commons; popisky přeloženy do latiny (moderní nomenklatura).", "img": "m256_lat.jpg", "items": [{"lat": "mm. scaleni", "cz": "kloněné svaly", "rects": [[0.4455, 0.7187, 0.0774, 0.0432]]}, {"lat": "m. scalenus anterior", "cz": "přední sval kloněný", "rects": [[0.3036, 0.9615, 0.1743, 0.0256]]}]}, {"kind": "flash", "title": "🃏 Flashcards", "help": "Otoč, ohodnoť se, neznámé se zopakují.", "items": [["kloněné (skalenové) svaly", "mm. scaleni"], ["přední sval kloněný", "m. scalenus anterior"], ["střední sval kloněný", "m. scalenus medius"], ["zadní sval kloněný", "m. scalenus posterior"], ["skalenová štěrbina", "fissura scalenorum"], ["podklíčková tepna", "a. subclavia"], ["pažní pleteň", "plexus brachialis"], ["příčný výběžek", "processus transversus"]]}]}, {"id": "a06", "kind": "anki", "title": "🧠 Anki pauza 06", "deck": "Anatomie::Svaly hlavy a krku::06 Skalenové svaly"}, {"id": "b07", "title": "07 Prevertebrální a meziobratlové svaly", "sub": "Maja Špiritović – Svaly krku", "html": "<p><b>Prevertebrální</b> (hluboké) svaly krku umožňují předklon hlavy a úklon:</p>\n<ul><li><b>m. longus colli</b> – těla obratlů Th1–Th3 až Cp a tuberculum anterius atlantis</li><li><b>m. longus capitis</b> – proc. transversi C3–C6 až báze lební</li></ul>\n<p>F: flexe hlavy a celé Cp, pomocné sunutí hlavy dopředu, lateroflexe. I: rr. ventrales nn. cervicalium C1–C8.</p>\n<p><b>Meziobratlové svaly</b> spojují sousední obratle nebo C1 s týlní kostí:</p>\n<ul><li><b>mm. intertransversarii anteriores cervicis</b> – 6 párů („dynamická ligamenta“) mezi příčnými výběžky, I: rr. ventrales C2–C7; mezi nimi štěrbiny pro míšní nervy a cévy → dlouhodobá kontrakce omezuje cirkulaci → bolest, flekční držení hlavy, kontraktury.</li>\n<li><b>m. rectus capitis anterior</b> – proc. transversus atlasu → báze lební; flexe v AO, drobné balanční pohyby; I: r. ventralis C1.</li>\n<li><b>m. rectus capitis lateralis</b> – proc. transversus C1 → spodní plocha proc. jugularis týlní kosti; lateroflexe hlavy; I: r. ventralis C1.</li></ul>", "tips": ["Longus <b>colli</b> = krk (obratel → obratel), longus <b>capitis</b> = hlava (končí na bázi lební).", "Prevertebrální = „flexoři“ krku – oslabení u předsunutého držení hlavy.", "Rectus capitis anterior a lateralis = jediné „přední“ svaly z C1 na lebku, oba r. ventralis C1."], "videos": [["pTWev6kO-Eg", "Prevertebral muscles of the neck", "Human Anatomy Lessons"], ["oPol73DPSds", "Longus capitis", "Dylan TheOsteo"]], "anim": null, "ex": [{"kind": "match", "title": "🔗 Přiřazovačka (latina ↔ čeština)", "help": "Ťukni na latinský termín a pak na ANIM.scm=el=>{el.innerHTML=`<h3>🎞️ M. sternocleidomastoideus – co dělá pravý sval?</h3><div class="help">Pohled zepředu na pacienta – jeho <b>pravá</b> strana je pro tebe vlevo. Pravý SCM (červeně) táhne proc. mastoideus k sternu.</div><svg viewBox="0 0 300 300" class="svgc"><rect x="118" y="175" width="64" height="80" fill="#fde2c8" stroke="#c08a5a"/><path d="M40 290 Q150 240 260 290" fill="#fde2c8" stroke="#c08a5a"/><rect x="142" y="250" width="16" height="40" fill="#e7cf9c" stroke="#8a6d3b"/><path d="M60 262 L142 256 M158 256 L240 262" stroke="#e7cf9c" stroke-width="8"/><g id="hd"><ellipse cx="150" cy="110" rx="62" ry="78" fill="#fde2c8" stroke="#c08a5a"/><circle id="mR" cx="102" cy="150" r="5" fill="#8a6d3b"/><g id="ft"><circle cx="128" cy="95" r="6"/><circle cx="172" cy="95" r="6"/><path d="M150 100 L144 128 L156 128" fill="none" stroke="#c08a5a" stroke-width="2"/><path d="M132 150 Q150 160 168 150" stroke="#b03a3a" stroke-width="4" fill="none"/></g></g><line id="scm" stroke="#dc2626" stroke-width="9" stroke-linecap="round" opacity=".8"/><line id="scl" stroke="#2563eb" stroke-width="9" stroke-linecap="round" opacity=".35"/><text x="6" y="20" font-size="12" fill="#dc2626">pravý SCM</text><text x="230" y="20" font-size="12" fill="#2563eb">levý SCM</text></svg><button class="pri" id="s1">Pravý SCM jednostranně</button><button id="s2">Oba SCM</button><button id="s0">Výchozí</button><div id="st" class="tip">Výchozí poloha.</div>`;

<script>window.LESSON={"key":"anat_klouby_hk_p2_v1","title":"Klouby HK – Part 2","sections":[{"id":"intro","title":"🏁 Start – jak na to","html":"<p><b>Study session · Part 2 · odhad ~60 min.</b> DRU, membrana interossea, radiocarpalis/mediocarpalis, CMC, MCP, IP. Nejdřív <a href=\"klouby-horni-koncetiny-uvod.html\">úvod</a>, ideálně i Part 1.</p>","tips":["Latina, typy, vazy a pohyby. Bez překladových dvojic česky↔latinsky."]},{"id":"b01","title":"01 Radioulnární distální + membrana","sub":"~12 min","html":"<p>PRU i DRU jsou kolové a pracují spolu. <span class=\"lat\">Discus articularis</span> (TFCC) je hlavní stabilizátor DRU. <span class=\"lat\">Membrana interossea antebrachii</span> přenáší sílu z radia na ulnu (vlákna běží od radia distálně k ulně). Samostatná tabule membrány v sadě není.</p><figure><img src=\"img/klouby/Gray336.png\" alt=\"Distální radioulnární kloub a discus (Gray 336)\"><figcaption>Gray 336: art. radioulnaris distalis a discus articularis. Membrana interossea tu není. · Gray’s Anatomy (1918), public domain – Wikimedia Commons · viz img/klouby/ATTRIBUTION.txt</figcaption></figure>","tips":["Pronace ~75°, supinace ~85°; funkčně ~50/50.","Ulna nemá přímý kontakt s karpem – je tam disk."],"videos":[["eJOiD1h-840","Radius & Ulna joints","Taim Talks Med"],["_SwF5fRC4Nw","DRUJ and TFCC","Orthopaedic Principles"]],"anim":"","ex":[{"kind":"cloze","title":"🧩 Doplňovačka (fakta)","help":"Doplň vynechaný latinský název / fakt.","items":["Art. radioulnaris distalis je typem {{c1::kolový}} kloub.","Hlavní stabilizátor a tlumič DRU je {{c1::discus articularis}} (TFCC).","Membrana interossea antebrachii přenáší sílu z {{c1::radia}} na {{c2::ulnu}}.","Pronace a supinace vyžadují současně {{c1::PRU}} i {{c2::DRU}}.","Funkční rozsah pronace/supinace je asi {{c1::50}}° / {{c2::50}}°."]},{"kind":"mcq","title":"❓ Kvíz","help":"Okamžitá zpětná vazba. Odpovědi v latině / typech kloubů.","items":[["Typ art. radioulnaris distalis?",["kolový","kladkový","elipsoidní","s lná {{c1::extenze}}.","Ulnární dukce je {{c1::větší}} než radiální (ulnární sklon radia).","Asi {{c1::80}} % tlaku jde na radius, {{c2::20}} % přes disk na ulnu.","Os triquetrum se discus articularis dotýká jen při {{c1::ulnární dukci}}."]},{"kind":"mcq","title":"❓ Kvíz","help":"Okamžitá zpětná vazba. Odpovědi v latině / typech kloubů.","items":[["Typ art. radiocarpalis?",["elipsoidní (biaxiální)","kladkový","kolový","plošný"],0,""],["Close-packed zápěstí?",["plná extenze","plná flexe","neutrál","max. radiální dukce"],0,""],["Které kosti karpu nesou většinu kontaktu s radiem?",["scaphoideum + lunatum","pisiforme + hamatum","trapezium + trapezoideum","triquetrum + pisiforme"],0,""],["Ulnární vs radiální dukce?",["ulnární je větší","radiální je větší","stejné","ulnární neexistuje"],0,""]]},{"kind":"flash","title":"🃏 Flashcards (fakta · latina)","help":"Otázka → latinská odpověď / fakt. Nejde o překlad česky↔latinsky.","items":[["Typ radiocarpalis","ellipsoidea (elipsoidní)"],["Close-packed zápěstí","plná extenze"],["Hlavní karpální kontakt s radiem","scaphoideum + lunatum"],["Rozložení tlaku radius : ulna (přes disk)","~80 : 20"]]}]},{"id":"a02","kind":"anki","title":"🧠 Anki pauza 02","deck":"Anatomie::Klouby HK::02 Zápěstí"},{"id":"b03","title":"03 CMC (vč. pollicis)","sub":"~12 min","html":"<p>CMC I = sedlový (<span class=\"lat\">os trapezium</span> × basis MC I) → opozice. Hlavní stabilizátor v opozici je dorzoradiální (radiální kolaterální) vaz. CMC II–III jsou stabilní osa ruky; IV–V pohyblivější. Samostatná tabule jen pro CMC v sadě není; štěrbiny jsou na Gray 334.</p>","tips":["Opozice = abdukce + flexe + vnitřní rotace MC I.","Close-packed CMC I = plná opozice."],"videos":[["uiyqVsSPD1w","Wrist and Hand Joints","AnatomyZone"]],"anim":"","ex":[{"kind":"cloze","title":"🧩 Doplňovačka (fakta)","help":"Doplň vynechaný latinský název / fakt.","items":["Art. carpometacarpalis pollicis je typem {{c1::sedlový}} kloub.","CMC I spojuje os {{c1::trapezium}} s basis ossis help":"Okamžitá zpětná vazba. Odpovědi v latině / typech kloubů.","items":[["Typ MCP II–V?",["elipsoidní","kladkový","sedlový","kolový"],0,""],["Typ IP kloubů?",["kladkový (ginglymus)","elipsoidní","plošný","sedlový"],0,""],["Close-packed MCP?",["flexe","extenze","abdukce","neutrál"],0,"Ligg. collateralia napjatá ve flexi."],["Close-packed IP?",["extenze","flexe","abdukce","opozice"],0,""]]},{"kind":"flash","title":"🃏 Flashcards (fakta · latina)","help":"Otázka → latinská odpověď / fakt. Nejde o překlad česky↔latinsky.","items":[["Typ MCP II–V","ellipsoidea"],["Typ IP","ginglymus"],["Close-packed MCP","flexe"],["Close-packed IP","extenze"],["Vaz držící hlavice MC","lig. metacarpale transversum profundum"]]}]},{"id":"a04","kind":"anki","title":"🧠 Anki pauza 04","deck":"Anatomie::Klouby HK::04 MCP IP"},{"id":"exam","title":"🎓 Zápočtový mini-test","html":"<p>Part 2 – souhrn. Odhad ~10–15 min. Jen latina / typy / vazy / pohyby – bez překladů.</p>","ex":[{"kind":"mcq","title":"Part 2 – souhrn","help":"Smíšené otázky z celé části.","items":[["Typ art. radiocarpalis?",["elipsoidní","kladkový","kolový","sedlový"],0,""],["Typ CMC I?",["sedlový","elipsoidní","kladkový","plošný"],0,""],["Typ IP?",["kladkový","elipsoidní","sedlový","kolový"],0,""],["Close-packed zápěstí?",["plná extenze","plná flexe","neutrál","max. UD"],0,""],["TFCC / discus stabilizuje hlavně…",["DRU","GH","SC","MCP"],0,""],["Partner basis MC I?",["os trapezium","os capitatum","os lunatum","os pisiforme"],0,""],["Close-packed MCP?",["flexe","extenze","abdukce","addukce"],0,""],["Membrana interossea přenáší sílu…",["radius → ulna","ulna → radius","humerus → radius","karpus → radius"],0,""]]}]}]};</script><script>(function(){

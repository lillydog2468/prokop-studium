function quizNorm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[.,;:!?()"']/g,' ').replace(/\s+/g,' ').trim();}
function quizCheck(q,ans){

}
function quizShuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

        get=function(){var c=box.querySelector('input:checked');return c?c.value:'';};
      } else {var inp=el('input',{type:'text',autocomplete:'off',spellcheck:'false',style:'width:90%;padding:4px'});box.appendChild(inp);get=function(){return inp.value;};}
      var fb=el('div',{style:'margin-top:4px'});box.appendChild(fb);root.appendChild(box);

function btn(txt,c,fn){var b=el('button',c||'',txt);b.type='button';b.onclick=fn;return b;}
function rec(k,ok,tot){ST[k]={ok:ok,t:tot,best:Math.max((ST[k]&&ST[k].best)||0,Math.round(100*ok/tot))};save();}
function scoreTxt(e,ok,tot){e.textContent='Skóre: '+ok+' / '+tot+' ('+Math.round(100*ok/tot)+' %)'+(ok===tot?' 🎉 paráda!':'');e.className='score '+(ok===tot?'good':(ok/tot>=.7?'mid':'bad'));}
function secStatus(s,i){var ks=s.ex.map(function(x,j){return 's'+i+'e'+j;});if(!ks.length)return ST['seen'+i]?'✔':'';var d=ks.filter(function(k){return ST[k];});if(!d.length)return ST['seen'+i]?'·':'';var m=Math.round(d.reduce(function(a,k){return a+ST[k].best;},0)/ks.length);return m>=80&&d.length===ks.length?'✔':m+'%';}
var cur=0;
function renderNav(){var nav=document.getElementById('nav');nav.innerHTML='';L.sections.forEach(function(s,i){var a=el('a',i===cur?'on':'');a.href='#'+i;var st=secStatus(s,i);a.innerHTML='';a.appendChild(el('span','sl',s.slide));a.appendChild(document.createTextNode(' '+s.title+' '));if(TM.sec[i]>=1000)a.appendChild(el('span','tm',fmt(TM.sec[i])));if(st)a.appendChild(el('span','st',st));a.onclick=function(){document.body.classList.remove('menu');};nav.appendChild(a);});
 var tot=L.sections.length,done=L.sections.filter(function(s,i){return secStatus(s,i)==='✔';}).length;document.getElementById('prog').textContent='Hotovo '+done+'/'+tot;}
function show(i){tflush();cur=Math.max(0,Math.min(L.sections.length-1,i));ST['seen'+cur]=1;save();var s=L.sections[cur],m=document.getElementById('main');m.innerHTML='';
 var h=el('h2','',s.title);m.appendChild(el('div','slideno','Slide '+s.slide));m.appendChild(h);
 if(s.intro){var d=el('div','intro');d.innerHTML=s.intro;m.appendChild(d);}
 (s.tips||[]).forEach(function(t){var d=el('div','tip');d.innerHTML='<b>💡 Tip:</b> '+t;m.appendChild(d);});
 if(s.table){var tb=el('table','vt');s.table.forEach(function(r){var tr=el('tr');tr.appendChild(el('td','la',alts(r[0])[0]));tr.appendChild(el('td','',alts(r[1])[0]));tr.appendChild(el('td','nt',r[2]||''));tb.appendChild(tr);});var det=el('details','tbl');det.appendChild(el('summary','','📖 Přehled (tahák) – rozbal, až když potřebuješ'));det.appendChild(tb);m.appendChild(det);}
 s.ex.forEach(function(x,j){var box=el('div','ex');box.appendChild(el('h3','',x.title));if(x.help)box.appendChild(el('div','help',x.help));var body=el('div');box.appendChild(body);m.appendChild(box);
  ({match:exMatch,type:exType,flash:exFlash})[x.kind](body,x,'s'+cur+'e'+j);});
 var pn=el('div','pn');if(cur>0)pn.appendChild(btn('← '+L.sections[cur-1].title,'sec',function(){location.hash=cur-1;}));if(cur<L.sections.length-1)pn.appendChild(btn(L.sections[cur+1].title+' →','pri',function(){location.hash=cur+1;}));m.appendChild(pn);
 window.scrollTo(0,0);renderNav();}
// ---- Přiřazovačka
function exMatch(root,x,key){var sets=chunk(x.items,x.size||8),si=0,tot={};
 function build(){root.innerHTML='';var it=sets[si],n=it.length,pairs={},rev={},selL=null,selR=null,checked=false;
  if(sets.length>1)root.appendChild(el('div','help','Sada '+(si+1)+' / '+sets.length));
  var g=el('div','mgrid'),cl=el('div','mcol'),cr=el('div','mcol');g.appendChild(cl);g.appendChild(cr);root.appendChild(g);
  var lb=[],rb={};var order=quizShuffle(it.map(function(_,i){return i;}));var lorder=quizShuffle(it.map(function(_,i){return i;}));
  lorder.forEach(function(i){var b=el('button','mi la',alts(it[i][0])[0]);b.type='button';b.onclick=function(){pick('L',i);};lb[i]=b;cl.appendChild(b);});
  order.forEach(function(i){var b=el('button','mi',alts(it[i][1])[0]);b.type='button';b.onclick=function(){pick('R',i);};rb[i]=b;cr.appendChild(b);});
  function paint(){for(var i=0;i<n;i++){var b=lb[i];b.classList.toggle('sel',selL===i);var p=pairs[i];b.dataset.k=p!=null?(i%8):'';b.querySelector('.tag')&&b.removeChild(b.querySelector('.tag'));}
   for(var r in rb){var bb=rb[r];bb.classList.toggle('sel',selR===+r);var t=bb.querySelector('.tag');if(t)bb.removeChild(t);}
   var num=1;lorder.forEach(function(i){if(pairs[i]!=null){var c='c'+(num%8);lb[i].className='mi la paired '+c;rb[pairs[i]].className='mi paired '+c;var t1=el('span','tag',num);lb[i].insertBefore(t1,lb[i].firstChild);rb[pairs[i]].insertBefore(el('span','tag',num),rb[pairs[i]].firstChild);num++;}else{lb[i].className='mi la'+(selL===i?' sel':'');}});
   for(var r2 in rb){if(rev[r2]==null)rb[r2].className='mi'+(selR===+r2?' sel':'');}}
  function link(l,r){if(pairs[l]!=null)delete rev[pairs[l]];if(rev[r]!=null)delete pairs[rev[r]];pairs[l]=r;rev[r]=l;selL=selR=null;}
  function pick(side,i){if(checked)return;if(side==='L'){if(pairs[i]!=null&&selR==null){delete rev[pairs[i]];delete pairs[i];selL=null;paint();return;}if(selR!=null){link(i,selR);}else selL=(selL===i?null:i);}
   else{if(rev[i]!=null&&selL==null){delete pairs[rev[i]];delete rev[i];selR=null;paint();return;}if(selL!=null){link(selL,i);}else selR=(selR===i?null:i);}paint();}
  var sc=el('div','score'),fb=el('div','fb'),bar=el('div','bar');
  bar.appendChild(btn('Zkontrolovat','pri',function(){if(checked)return;checked=true;var r=gradeMatch(n,pairs);for(var i=0;i<n;i++){lb[i].className='mi la '+(r.res[i]?'ok':'no');if(pairs[i]!=null)rb[pairs[i]].className='mi '+(r.res[i]?'ok':'no');}
    fb.innerHTML='';it.forEach(function(p,i){if(!r.res[i]){var d=el('div','wrong');d.innerHTML='✘ <b>'+alts(p[0])[0]+'</b> = '+alts(p[1])[0]+(p[2]?' <span class="nt">('+p[2]+')</span>':'');fb.appendChild(d);}});
    scoreTxt(sc,r.ok,n);tot[si]=r.ok;var s=0;for(var k in tot)s+=tot[k];rec(key,s,x.items.length);}));
  bar.appendChild(btn('Znovu (zamíchat)','sec',build));
  if(sets.length>1){if(si>0)bar.appendChild(btn('← Předchozí sada','sec',function(){si--;build();}));if(si<sets.length-1)bar.appendChild(btn('Další sada →','sec',function(){si++;build();}));}
  root.appendChild(bar);root.appendChild(sc);root.appendChild(fb);paint();}
 build();}
// ---- Doplňovačka / překlad
function exType(root,x,key){function build(){root.innerHTML='';var its=x.noShuffle?x.items:quizShuffle(x.items),rows=[];
  its.forEach(function(p,i){var b=el('div','q');var pr=x.rev?p[1]:p[0],an=x.rev?p[0]:p[1];if(x.opp){pr=p[0];an=p[1];}
   b.appendChild(el('div','qp',(i+1)+'. '+alts(pr)[0]));var inp=el(x.long?'textarea':'input');inp.setAttribute('autocomplete','off');inp.setAttribute('autocorrect','off');inp.setAttribute('autocapitalize','off');inp.setAttribute('spellcheck','false');b.appendChild(inp);
   var f=el('div','fb');b.appendChild(f);root.appendChild(b);rows.push({p:p,an:an,inp:inp,f:f,b:b,ok:false});});
  var sc=el('div','score'),bar=el('div','bar');
  function upd(){var ok=rows.filter(function(r){return r.ok;}).length;scoreTxt(sc,ok,rows.length);rec(key,ok,rows.length);}
  bar.appendChild(btn('Zkontrolovat','pri',function(){rows.forEach(function(r){r.ok=gradeText(r.inp.value,r.an);r.b.className='q '+(r.ok?'ok':'no');r.f.innerHTML='';
    if(r.ok){r.f.innerHTML='✔ Správně'+(alts(r.an).length>1&&lnorm(r.inp.value)!==lnorm(alts(r.an)[0])?' (vzor: <b>'+alts(r.an)[0]+'</b>)':'')+(r.p[2]?' <span class="nt">· '+r.p[2]+'</span>':'');}
    else{r.f.innerHTML='✘ Vzor: <b>'+alts(r.an)[0]+'</b>'+(r.p[2]?' <span class="nt">· '+r.p[2]+'</span>':'');var u=btn('Mám to dobře (uznat)','mini',function(){r.ok=true;r.b.className='q ok';u.remove();upd();});r.f.appendChild(document.createTextNode(' '));r.f.appendChild(u);}});upd();}));
  bar.appendChild(btn('Znovu (zamíchat)','sec',build));
  bar.appendChild(btn('Jen chyby znovu','sec',function(){var bad=rows.filter(function(r){return r.b.className==='q no';}).map(function(r){return r.p;});if(!bad.length)return;var y=Object.assign({},x,{items:bad});exType(root,y,key+'_r');}));
  root.appendChild(bar);root.appendChild(sc);}
 build();}
// ---- Flashcards
function exFlash(root,x,key){var all=x.items.slice(),rev=false;
 function run(deck){root.innerHTML='';var q=quizShuffle(deck),i=0,bad=[],good=0;
  var ctl=el('div','bar');var dirb=btn(rev?'Směr: latina → čeština':'Směr: čeština → latina','sec',function(){rev=!rev;run(deck);});ctl.appendChild(dirb);root.appendChild(ctl);
  var info=el('div','help'),card=el('div','card'),bar=el('div','bar');root.appendChild(info);root.appendChild(card);root.appendChild(bar);
  function next(){if(i>=q.length){card.className='card';card.innerHTML='<div class="front">Hotovo! Umíš '+good+' / '+q.length+'</div>';bar.innerHTML='';rec(key,good,q.length);
     if(bad.length)bar.appendChild(btn('Procvičit neumím ('+bad.length+')','pri',function(){run(bad);}));bar.appendChild(btn('Zamíchat vše','sec',function(){run(all);}));return;}
   var p=q[i],fr=rev?p[0]:p[1],bk=rev?p[1]:p[0];info.textContent='Karta '+(i+1)+' / '+q.length+' · umím '+good+' · neumím '+bad.length;card.className='card';
   card.innerHTML='';card.appendChild(el('div','front',alts(fr)[0]));var back=el('div','back');back.appendChild(el('div','la big',alts(bk)[0]));if(p[2])back.appendChild(el('div','nt',p[2]));card.appendChild(back);card.appendChild(el('div','hint','(ťukni pro otočení)'));
   card.onclick=function(){card.classList.toggle('flip');};bar.innerHTML='';
   bar.appendChild(btn('✔ Umím','okb',function(){good++;i++;next();}));bar.appendChild(btn('✘ Neumím','nob',function(){bad.push(p);i++;next();}));}
  next();}
 run(all);}
window.addEventListener('hashchange',function(){show(parseInt(location.hash.slice(1))||0);});
document.addEventListener('DOMContentLoaded',function(){document.getElementById('mbtn').onclick=function(){document.body.classList.toggle('menu');};
 document.getElementById('tplay').onclick=function(){TM.running?tpause():tstart();};document.getElementById('treset').onclick=function(){if(confirm('Vynulovat časomíru této lekce?')){TM={total:0,sec:{},running:false,at:0};tsave();tdraw();renderNav();}};tdraw();
 document.getElementById('reset').onclick=function(){if(confirm('Smazat uložený postup (skóre) této lekce? Časomíra zůstane.')){ST={};save();show(cur);}};
 show(parseInt(location.hash.slice(1))||0);});
})();
